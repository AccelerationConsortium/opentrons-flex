[project]
name = "flex-unit-operations"
version = "0.1.0"
description = "Unit operations for the Opentrons Flex, driven over the SiLA2 connector."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Shared SiLA2 client plumbing (connect/retry/timeout, error classification).
    "sila-toolkit",
    # Read-only geometry: deck slot origins, labware dimensions and gripper parameters.
    # Never used to actuate hardware -- every physical action is a SiLA command.
    "opentrons-shared-data>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

# sila-toolkit is not published; it lives in the uoroboros workspace and is checked out
# by git ref. It requires unitelabs-sila>=0.9.1, which conflicts with the older
# unitelabs-sila the connector itself resolves through unitelabs-cdk -- hence this is a
# separate distribution with its own environment rather than a module inside the
# connector package. SiLA 2 is version-independent on the wire.
[tool.uv.sources]
sila-toolkit = { git = "https://github.com/AccelerationConsortium/uoroboros.git", branch = "feat/sila-toolkit-optional-extra", subdirectory = "packages/sila-toolkit" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flex_unit_operations"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--color=yes"

[tool.ruff]
src = ["src", "tests"]
line-length = 120
target-version = "py312"
